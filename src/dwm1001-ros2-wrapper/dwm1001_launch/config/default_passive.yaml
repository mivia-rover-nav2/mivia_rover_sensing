dwm_passive:
  ros__parameters:
    # "auto" resolves the port automatically (udev rule -> by-id -> raw
    # fallback, see launch/_dwm1001_serial.py). Set an explicit path here to
    # override, e.g. "/dev/ttyACM0" or "/dev/dwm1001_uwb".
    serial_port: "auto"
    ignore_tags: ""
    num_samples: 3
