# Velodyne VLP-16 parameters for the Mivia Rover.
#
# Overrides the stock velodyne_driver / velodyne_pointcloud configuration so
# that:
#   - the driver only accepts packets coming from the sensor's fixed IP
#     (keep device_ip in sync with LIDAR_DEVICE_IP in
#     system_configuration/env/mivia_rover.env);
#   - the point cloud is published in the "velodyne" TF frame declared by
#     mivia_rover_description/urdf/mivia_rover_description.urdf.xacro.
#
# The "calibration" parameter of velodyne_transform_node is intentionally left
# out here: it is set at launch time to the absolute path of the VLP16db.yaml
# shipped inside the velodyne_pointcloud package.

velodyne_driver_node:
  ros__parameters:
    device_ip: 192.168.1.201
    port: 2368
    model: VLP16
    rpm: 600.0
    frame_id: velodyne
    gps_time: false
    time_offset: 0.0
    timestamp_first_packet: false

velodyne_transform_node:
  ros__parameters:
    model: VLP16
    min_range: 0.4
    max_range: 100.0
    view_direction: 0.0
    organize_cloud: true
    fixed_frame: ""
    target_frame: ""
